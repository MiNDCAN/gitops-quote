env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-rifast/quoteplus-mdm-service-dev
  tag: ""   # REPLACE_WITH_REAL_VALUE - no RIFAST-specific Jenkins stage yet

ingress:
  host: "rifast-quoteplus.mdm.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below. See quoteplus-framework.yaml
# for the full reasoning on this pattern and CLAUDE.md.
configApp: {}

envFrom:
  configMaps: []

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # LIMANS is stage's internal martinrea.com integration - almost certainly
  # NOT applicable to RIFAST, a separate customer. Confirm with the dev
  # team whether this feature applies here at all before populating these
  # Key Vault secrets. DATABASE_USER_NAME duplicates DATABASE_USERNAME on
  # purpose - mdm-service's own code reads the former (a confirmed typo vs.
  # other services, see gitops-quote-mrea's equivalent file).
  data:
    DATABASE_HOST: "rifast-database-host"
    DATABASE_PORT: "rifast-database-port"
    DB_SCHEMA: "rifast-db-schema"
    AWS_REGION: "rifast-aws-region"
    AWS_S3_BUCKET: "rifast-mdmservice-aws-s3-bucket"
    PUBLIC_AWS_S3_BUCKET: "rifast-mdmservice-public-aws-s3-bucket"
    EMAIL_HOST: "rifast-email-host"
    EMAIL_PORT: "rifast-email-port"
    EMAIL_SECURE: "rifast-email-secure"
    LIMANS_API_ID: "rifast-limans-api-id-or-confirm-not-applicable"
    LIMANS_URL: "rifast-limans-url-or-confirm-not-applicable"
    QUOTE_SERVICE_URL: "rifast-mdmservice-quote-service-url"
    LANGUAGE_SERVICE_URL: "rifast-mdmservice-language-service-url"
    KEYCLOAK_SERVER_URL: "rifast-keycloak-server-url"
    KEYCLOAK_REALM: "rifast-keycloak-realm"
    DATABASE_USERNAME: "rifast-app-database-user"
    DATABASE_USER_NAME: "rifast-app-database-user"
    DATABASE_NAME: "rifast-app-database-name"
    DATABASE_PASSWORD: "rifast-app-database-password"
    AWS_ACCESS_KEY_ID: "rifast-aws-access-key-id"
    AWS_SECRET_ACCESS_KEY: "rifast-aws-secret-access-key"
    EMAIL_USER: "rifast-email-user"
    EMAIL_FROM: "rifast-email-from"
    EMAIL_PASSWORD: "rifast-email-password"
    LIMANS_API_KEY: "rifast-limans-api-key-or-confirm-not-applicable"
    LIMANS_TOKEN: "rifast-limans-token-or-confirm-not-applicable"
