env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-rifast/quoteplus-framework-rifast
  tag: "latest"   # PLACEHOLDER - no RIFAST-specific Jenkins stage yet, no real image
  # published. Non-empty on purpose so the chart's `required` guard passes and
  # the Deployment actually renders - expected to ImagePullBackOff until
  # Jenkins publishes a real tag here. Confirmed acceptable by the user.

ingress:
  host: "rifast-quoteplus.framework.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below, not just real secrets.
# envFrom.configMaps overridden to [] since no ConfigMap is rendered at all
# (configApp is empty) - same override pattern quoteplus-frontend already
# used for its own all-empty case. See CLAUDE.md.
configApp: {}

envFrom:
  configMaps: []

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # Shared keys (rifast-database-*, rifast-keycloak-*) reuse the SAME Key
  # Vault secret name across every service that needs them - populate once,
  # every service picks it up. Service-specific keys are prefixed
  # rifast-framework-*. REPLACE_WITH_REAL_VALUE items still need real
  # business data in Key Vault; structural ones (DB host, in-cluster URLs)
  # get populated with their already-known real values.
  data:
    DATABASE_HOST: "rifast-database-host"
    DATABASE_PORT: "rifast-database-port"
    DB_SCHEMA: "rifast-db-schema"
    MAX_WORKERS: "rifast-framework-max-workers"
    LOG_LEVEL: "rifast-framework-log-level"
    NOTIFICATION_API_URL: "rifast-framework-notification-api-url"
    SHAREPOINT_SCOPE: "rifast-sharepoint-scope"
    SHAREPOINT_SITE_ID: "rifast-sharepoint-site-id"
    KEYCLOAK_SERVER_URL: "rifast-keycloak-server-url"
    KEYCLOAK_REALM: "rifast-keycloak-realm"
    KEYCLOAK_CLIENT_ID: "rifast-keycloak-client-id"
    USER_MANAGEMENT_SERVICE_URL: "rifast-framework-user-management-service-url"
    APPLICATION_ID: "rifast-application-id"
    DATABASE_NAME: "rifast-app-database-name"
    DATABASE_USER_NAME: "rifast-app-database-user"
    DATABASE_PASSWORD: "rifast-app-database-password"
    SUPPORT_EMAIL: "rifast-support-email"
    AZURE_CLIENT_ID: "rifast-azure-client-id"
    AZURE_TENANT_ID: "rifast-azure-tenant-id"
    AZURE_CLIENT_SECRET: "rifast-azure-client-secret"
    KEYCLOAK_CLIENT_SECRET: "rifast-keycloak-client-secret"
