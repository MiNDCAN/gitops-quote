# Real values from QUOTE_AZURE_INFRA/terraform/tenants/rifast-prod's
# `terraform apply` output (2026-10-23) - not secrets themselves (a client
# ID/tenant ID/vault URL are identifiers, not credentials), committed
# directly same as every other non-secret config value in this repo.
external-secrets:
  installCRDs: true
  replicaCount: 1
  serviceAccount:
    create: true
    name: external-secrets
  podLabels:
    azure.workload.identity/use: "true"

workloadIdentity:
  enabled: true
  serviceAccountName: quoteplus-workload-sa
  storeName: quoteplus-azure-keyvault
  vaultUrl: "https://kv-rifast-quoteplus.vault.azure.net/"
  clientId: "7a5da97e-bfa8-4335-af23-f9220230b719"
  tenantId: "90eaee3c-4074-426d-994b-75a5053978df"
  # Must match QUOTE_AZURE_INFRA/terraform/tenants/rifast-prod/workload_identity.tf's
  # workload_identity_namespaces list exactly.
  namespaces:
    - quote-frontend
    - quote-framework
    - quote-mdmservice
    - quote-res-mdm
    - quote-report
    - quote-supplier
    - quote-user-management
    - quote-customer-management
    - quote-language
    - quotemanagement-service
    - quote-distribution-list
    - quote-redis
    - quote-postgres
    - quote-pgadmin
    - quote-temporal
    - quote-temporal-worker
    - quote-metabase

nexusPullSecret:
  enabled: true
  name: quoteplus-nexus-secrets
  refreshInterval: 1h
  keyVaultKey: quoteplus-nexus-dockerconfigjson
