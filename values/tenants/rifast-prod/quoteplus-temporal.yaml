# RIFAST overrides for quoteplus-temporal. Base chart's web.ingress.hosts/tls
# and web.additionalEnv hardcode stage's host/Keycloak realm - both fully
# overridden here since Helm replaces (not merges) list-type values.
#
# TEMPORAL_DB_PASSWORD must match POSTGRES_PASSWORD in
# quoteplus-temporal-postgres.yaml - keep both Key Vault secrets in sync.
# TEMPORAL_AUTH_PROVIDER_URL/CALLBACK_URL and the Keycloak client
# ID/secret below all depend on RIFAST's production Keycloak realm, which
# hasn't been shared yet - REPLACE_WITH_REAL_VALUE throughout.
temporal:
  web:
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: quoteplus-letsencrypt-prod
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
        nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      hosts:
        - "rifast-quoteplus.temporal.mindcaninc.com/"
      tls:
        - hosts:
            - rifast-quoteplus.temporal.mindcaninc.com
          secretName: quoteplus-temporal-ui-tls
    additionalEnv:
      - name: TEMPORAL_AUTH_ENABLED
        value: "true"
      - name: TEMPORAL_AUTH_PROVIDER_URL
        value: "REPLACE_WITH_REAL_VALUE"   # https://<prod-keycloak>/realms/<RIFAST realm>
      - name: TEMPORAL_AUTH_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: quoteplus-temporal-secrets
            key: TEMPORAL_AUTH_CLIENT_ID
      - name: TEMPORAL_AUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: quoteplus-temporal-secrets
            key: TEMPORAL_AUTH_CLIENT_SECRET
      - name: TEMPORAL_AUTH_CALLBACK_URL
        value: "https://rifast-quoteplus.temporal.mindcaninc.com/auth/sso/callback"
      - name: TEMPORAL_AUTH_SCOPES
        value: "openid,profile,email"

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE - not yet populated in kv-rifast-quoteplus.
  # TEMPORAL_AUTH_CLIENT_ID/SECRET depend on a Keycloak client that doesn't
  # exist yet (needs the production realm details).
  data:
    TEMPORAL_DB_PASSWORD: "rifast-temporal-postgres-password"
    TEMPORAL_AUTH_CLIENT_ID: "rifast-temporal-auth-client-id"
    TEMPORAL_AUTH_CLIENT_SECRET: "rifast-temporal-auth-client-secret"
