# This instance's own superuser, dedicated to Temporal only - never
# RIFAST's app Postgres. Same password must also be set as
# TEMPORAL_DB_PASSWORD in quoteplus-temporal.yaml so the server chart can
# connect as this user - keep both Key Vault secrets in sync.
secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE - not yet populated in kv-rifast-quoteplus.
  # POSTGRES_PASSWORD here and TEMPORAL_DB_PASSWORD in quoteplus-temporal.yaml
  # must be the SAME Key Vault secret value (can point at the same Key Vault
  # secret name, or be kept in sync manually).
  data:
    POSTGRES_USER: "rifast-temporal-postgres-user"
    POSTGRES_PASSWORD: "rifast-temporal-postgres-password"
