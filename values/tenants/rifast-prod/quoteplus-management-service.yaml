env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-rifast/quoteplus-management-dev
  tag: ""   # REPLACE_WITH_REAL_VALUE - no RIFAST-specific Jenkins stage yet

ingress:
  host: "rifast-quoteplus.management.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below. See quoteplus-framework.yaml
# for the full reasoning on this pattern and CLAUDE.md.
configApp: {}

envFrom:
  configMaps: []

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE - not yet populated in kv-rifast-quoteplus.
  # DATABASE_USER_NAME duplicates DATABASE_USERNAME on purpose - this
  # service's own code reads the former (a confirmed typo vs. other
  # services, see gitops-quote-mrea's equivalent file).
  data:
    DATABASE_HOST: "rifast-database-host"
    DATABASE_PORT: "rifast-database-port"
    DB_SCHEMA: "rifast-db-schema"
    AWS_REGION: "rifast-aws-region"
    AWS_S3_BUCKET: "rifast-management-aws-s3-bucket"
    PUBLIC_AWS_S3_BUCKET: "rifast-management-public-aws-s3-bucket"
    EMAIL_HOST: "rifast-email-host"
    EMAIL_PORT: "rifast-email-port"
    EMAIL_SECURE: "rifast-email-secure"
    SHAREPOINT_ROOT_FOLDER: "rifast-sharepoint-root-folder"
    APP_CLOUD_STORAGE: "rifast-management-app-cloud-storage"
    BASE_URL: "rifast-application-url"
    USER_DETAILS_URL: "rifast-management-user-details-url"
    MICROSOFT_OAUTH_TOKEN_URL: "rifast-microsoft-oauth-token-url"
    CLIENT_ID: "rifast-azure-client-id"
    SITE_ID: "rifast-sharepoint-site-id"
    DRIVE_ID: "rifast-sharepoint-drive-id"
    FRAMEWORK_URL: "rifast-management-framework-url"
    SITE_URL: "rifast-management-site-url"
    TENANT_ID: "rifast-azure-tenant-id"
    FILE_PATH: "rifast-management-file-path"
    MDM_URL: "rifast-management-mdm-url"
    LANGUAGE_SERVICE_URL: "rifast-management-language-service-url"
    SUPPLIER_URL: "rifast-management-supplier-url"
    MODEL_TYPE: "rifast-management-model-type"
    KEYCLOAK_SERVER_URL: "rifast-keycloak-server-url"
    KEYCLOAK_REALM: "rifast-keycloak-realm"
    KEYCLOAK_CLIENT_ID: "rifast-keycloak-client-id"
    IS_EMAIL_ENABLED: "rifast-management-is-email-enabled"
    DATABASE_USERNAME: "rifast-app-database-user"
    DATABASE_USER_NAME: "rifast-app-database-user"
    DATABASE_NAME: "rifast-app-database-name"
    DATABASE_PASSWORD: "rifast-app-database-password"
    AWS_ACCESS_KEY_ID: "rifast-aws-access-key-id"
    AWS_SECRET_ACCESS_KEY: "rifast-aws-secret-access-key"
    EMAIL_USER: "rifast-email-user"
    EMAIL_FROM: "rifast-email-from"
    EMAIL_PASSWORD: "rifast-email-password"
    CLIENT_SECRET: "rifast-client-secret"
    KEYCLOAK_CLIENT_SECRET: "rifast-keycloak-client-secret"
    # Matches the value given to quoteplus-temporal-worker.yaml -
    # the worker calls this service's GraphQL using this as a bearer key.
    INTERNAL_API_KEY: "rifast-internal-api-key"
