env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-dev/quoteplus-management-dev
  tag: ""   # REPLACE_WITH_REAL_VALUE - no RIFAST-specific Jenkins stage yet

ingress:
  host: "rifast-quoteplus.management.mindcaninc.com"

configApp:
  DATABASE_HOST: "quoteplus-postgres-service.quote-postgres.svc.cluster.local"
  DATABASE_PORT: "5432"
  DB_SCHEMA: "public"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "REPLACE_WITH_REAL_VALUE"
  PUBLIC_AWS_S3_BUCKET: "REPLACE_WITH_REAL_VALUE"
  EMAIL_HOST: "smtp-mail.outlook.com"
  EMAIL_PORT: "587"
  EMAIL_SECURE: "true"
  SHAREPOINT_ROOT_FOLDER: "PROD/"
  APP_CLOUD_STORAGE: "SHAREPOINT"
  BASE_URL: "https://rifast-quoteplus.mindcaninc.com"
  USER_DETAILS_URL: "https://rifast-quoteplus.user.mindcaninc.com"
  MICROSOFT_OAUTH_TOKEN_URL: "REPLACE_WITH_REAL_VALUE"   # https://login.microsoftonline.com/<RIFAST tenant>/oauth2/v2.0/token
  CLIENT_ID: "REPLACE_WITH_REAL_VALUE"
  SITE_ID: "REPLACE_WITH_REAL_VALUE"
  DRIVE_ID: "REPLACE_WITH_REAL_VALUE"
  FRAMEWORK_URL: "https://rifast-quoteplus.framework.mindcaninc.com"
  SITE_URL: "REPLACE_WITH_REAL_VALUE"
  TENANT_ID: "REPLACE_WITH_REAL_VALUE"
  FILE_PATH: "Shared Documents/BACKUP"
  MDM_URL: "https://rifast-quoteplus.mdm.mindcaninc.com"
  LANGUAGE_SERVICE_URL: "http://rifast-quoteplus.language.mindcaninc.com"
  SUPPLIER_URL: "https://rifast-quoteplus.supplier.mindcaninc.com"
  MODEL_TYPE: "3b"
  KEYCLOAK_SERVER_URL: "REPLACE_WITH_REAL_VALUE"
  KEYCLOAK_REALM: "REPLACE_WITH_REAL_VALUE"
  KEYCLOAK_CLIENT_ID: "REPLACE_WITH_REAL_VALUE"
  IS_EMAIL_ENABLED: "true"

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE - not yet populated in kv-rifast-quoteplus.
  # DATABASE_USER_NAME duplicates DATABASE_USERNAME on purpose - this
  # service's own code reads the former (a confirmed typo vs. other
  # services, see gitops-quote-mrea's equivalent file).
  data:
    DATABASE_USERNAME: "rifast-app-database-user"
    DATABASE_USER_NAME: "rifast-app-database-user"
    DATABASE_NAME: "rifast-app-database-name"
    DATABASE_PASSWORD: "rifast-app-database-password"
    AWS_ACCESS_KEY_ID: "rifast-aws-access-key-id"
    AWS_SECRET_ACCESS_KEY: "rifast-aws-secret-access-key"
    EMAIL_USER: "rifast-email-user"
    EMAIL_FROM: "rifast-email-from"
    EMAIL_PASSWORD: "rifast-email-password"
    CLIENT_SECRET: "rifast-client-secret"
    KEYCLOAK_CLIENT_SECRET: "rifast-keycloak-client-secret"
    # Matches the value given to quoteplus-temporal-worker.yaml -
    # the worker calls this service's GraphQL using this as a bearer key.
    INTERNAL_API_KEY: "rifast-internal-api-key"
