env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-rifast/quoteplus-distribution-list-service-dev
  tag: "latest"   # PLACEHOLDER - no RIFAST-specific Jenkins stage yet, no real image
  # published. Non-empty on purpose so the chart's `required` guard passes and
  # the Deployment actually renders - expected to ImagePullBackOff until
  # Jenkins publishes a real tag here. Confirmed acceptable by the user.

ingress:
  host: "rifast-quoteplus.distribution-list.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below. See quoteplus-framework.yaml
# for the full reasoning on this pattern and CLAUDE.md.
configApp: {}

envFrom:
  configMaps: []

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE - some keys below still not populated in
  # kv-rifast-quoteplus (DB/email creds etc). Keycloak keys ARE now
  # populated: realm QuotePlus-Rifast created 2026-10-28 on
  # https://keycloak.mindcaninc.com, cloned from QuotePlus-Customerdemo.
  # QP_KEYCLOAK_CLIENT_SECRET and KEYCLOAK_CLIENT_SECRET are the SAME
  # Keycloak client (qtplus_admin) - same Key Vault secret name, not two
  # different values (matches stage's own resolved convention).
  data:
    QP_KEYCLOAK_SERVER_URL: "rifast-keycloak-server-url"
    QP_KEYCLOAK_REALM: "rifast-keycloak-realm"
    QP_KEYCLOAK_CLIENT_ID: "rifast-keycloak-client-id"
    QP_KEYCLOAK_CLIENT_UUID: "rifast-keycloak-client-uuid"
    QP_KEYCLOAK_WEB_CLIENT_ID: "rifast-keycloak-web-client-id"
    VALID_APPLICATIONIDS: "rifast-distribution-list-valid-applicationids"
    QP_APP_REDIRECT_URL: "rifast-application-url"
    MAGIC_LINK_EXPIRE_TIME: "rifast-distribution-list-magic-link-expire-time"
    USERS_API_URL: "rifast-distribution-list-users-api-url"
    USER_DETAILS_URL: "rifast-distribution-list-user-details-url"
    KEYCLOAK_SERVER_URL: "rifast-keycloak-server-url"
    KEYCLOAK_REALM: "rifast-keycloak-realm"
    KEYCLOAK_CLIENT_ID: "rifast-keycloak-client-id"
    MDM_URL: "rifast-distribution-list-mdm-url"
    REDIS_HOST: "rifast-redis-host"
    REDIS_PORT: "rifast-redis-port"
    DATABASE_HOST: "rifast-database-host"
    DATABASE_PORT: "rifast-database-port"
    DB_SCHEMA: "rifast-db-schema"
    EMAIL_HOST: "rifast-email-host"
    EMAIL_PORT: "rifast-email-port"
    QP_KEYCLOAK_CLIENT_SECRET: "rifast-keycloak-client-secret"
    KEYCLOAK_CLIENT_SECRET: "rifast-keycloak-client-secret"
    REDIS_PASSWORD: "rifast-redis-password-noop"
    DATABASE_NAME: "rifast-app-database-name"
    DATABASE_USER_NAME: "rifast-app-database-user"
    DATABASE_PASSWORD: "rifast-app-database-password"
    EMAIL_USER: "rifast-email-user"
    EMAIL_PASSWORD: "rifast-email-password"
    EMAIL_FROM: "rifast-email-from"
