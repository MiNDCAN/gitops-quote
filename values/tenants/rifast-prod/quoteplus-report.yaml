env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-rifast/quoteplus-report-dev
  tag: ""   # REPLACE_WITH_REAL_VALUE - no RIFAST-specific Jenkins stage yet

ingress:
  host: "rifast-quoteplus.report.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below. See quoteplus-framework.yaml
# for the full reasoning on this pattern and CLAUDE.md.
configApp: {}

envFrom:
  configMaps: []

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE items still need real business data in Key
  # Vault; structural ones (DB host, in-cluster URLs) get populated with
  # their already-known real values. Shared keys reuse the SAME Key Vault
  # secret name across every service that needs them.
  data:
    DATABASE_HOST: "rifast-database-host"
    DATABASE_PORT: "rifast-database-port"
    DB_SCHEMA: "rifast-db-schema"
    AWS_REGION: "rifast-aws-region"
    AWS_S3_BUCKET: "rifast-report-aws-s3-bucket"
    PUBLIC_AWS_S3_BUCKET: "rifast-report-public-aws-s3-bucket"
    EMAIL_HOST: "rifast-email-host"
    EMAIL_PORT: "rifast-email-port"
    EMAIL_SECURE: "rifast-email-secure"
    MDM_URL: "rifast-report-mdm-url"
    LANGUAGE_SERVICE_URL: "rifast-report-language-service-url"
    FRAMEWORK_URL: "rifast-report-framework-url"
    KEYCLOAK_SERVER_URL: "rifast-keycloak-server-url"
    KEYCLOAK_REALM: "rifast-keycloak-realm"
    USER_DETAILS_URL: "rifast-report-user-details-url"
    DATABASE_USERNAME: "rifast-app-database-user"
    DATABASE_USER_NAME: "rifast-app-database-user"
    DATABASE_NAME: "rifast-app-database-name"
    DATABASE_PASSWORD: "rifast-app-database-password"
    AWS_ACCESS_KEY_ID: "rifast-aws-access-key-id"
    AWS_SECRET_ACCESS_KEY: "rifast-aws-secret-access-key"
    EMAIL_USER: "rifast-email-user"
    EMAIL_FROM: "rifast-email-from"
    EMAIL_PASSWORD: "rifast-email-password"
