env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-dev/quoteplus-customer-management-service-dev
  tag: ""   # REPLACE_WITH_REAL_VALUE - no RIFAST-specific Jenkins stage yet

ingress:
  host: "rifast-quoteplus.customer.mindcaninc.com"

# Two distinct AWS credential pairs exist here (AWS_S3_ACCESS_ID/KEY in
# configApp, AWS_ACCESS_KEY_ID/SECRET in secrets) - genuinely different
# keys, not a duplicate, same as stage.
configApp:
  DATABASE_HOST: "quoteplus-postgres-service.quote-postgres.svc.cluster.local"
  DATABASE_PORT: "5432"
  DB_SCHEMA: "public"
  SUP_MDM_URL: "https://rifast-quoteplus.mdm.mindcaninc.com/mdm"
  LANGUAGE_SERVICE_URL: "https://rifast-quoteplus.language.mindcaninc.com"
  QUOTE_URL: "https://rifast-quoteplus.management.mindcaninc.com/quote/graphql"
  EMAIL_HOST: "smtp-mail.outlook.com"
  EMAIL_PORT: "587"
  EMAIL_SECURE: "true"
  SHAREPOINT_ROOT_FOLDER: "PROD/"
  SITE_URL: "REPLACE_WITH_REAL_VALUE"
  AZURE_TENANT_ID: "REPLACE_WITH_REAL_VALUE"
  AZURE_CLIENT_ID: "REPLACE_WITH_REAL_VALUE"
  AZURE_SHAREPOINT_SITE_ID: "REPLACE_WITH_REAL_VALUE"
  AZURE_SHAREPOINT_DRIVE_ID: "REPLACE_WITH_REAL_VALUE"
  APP_CLOUD_STORAGE: "SHAREPOINT"
  AWS_S3_REGION: "us-east-1"
  AWS_S3_BUCKET_NAME: "REPLACE_WITH_REAL_VALUE"
  CLIENT_ID: "REPLACE_WITH_REAL_VALUE"
  SITE_ID: "REPLACE_WITH_REAL_VALUE"
  DRIVE_ID: "REPLACE_WITH_REAL_VALUE"
  TENANT_ID: "REPLACE_WITH_REAL_VALUE"
  FILE_PATH: "Shared Documents/BACKUP"
  MICROSOFT_OAUTH_TOKEN_URL: "REPLACE_WITH_REAL_VALUE"   # https://login.microsoftonline.com/<RIFAST tenant>/oauth2/v2.0/token
  KEYCLOAK_SERVER_URL: "REPLACE_WITH_REAL_VALUE"
  KEYCLOAK_REALM: "REPLACE_WITH_REAL_VALUE"
  # Global Data sync feature - cron/timezone kept as stage's (structural,
  # not customer-specific); SharePoint folder/drive ID are RIFAST's own.
  GLOBAL_DATA_SP_FOLDER_PATH: "REPLACE_WITH_REAL_VALUE"
  GLOBAL_DATA_SP_FILE_PATTERN: "*.xls*"
  GLOBAL_DATA_SYNC_TAB_NAME: "Data"
  GLOBAL_DATA_SP_DRIVE_ID: "REPLACE_WITH_REAL_VALUE"
  GLOBAL_DATA_SYNC_CRON: "0 0 1 1 1,4,7,10 *"
  GLOBAL_DATA_SYNC_TIMEZONE: "Asia/Kolkata"
  GLOBAL_DATA_SYNC_NOTIFY: "true"
  DATA_ADMIN_ROLE: "Data Admin"

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE - not yet populated in kv-rifast-quoteplus.
  data:
    AWS_ACCESS_KEY_ID: "rifast-aws-access-key-id"
    AWS_SECRET_ACCESS_KEY: "rifast-aws-secret-access-key"
    DATABASE_NAME: "rifast-app-database-name"
    DATABASE_PASSWORD: "rifast-app-database-password"
    DATABASE_USER_NAME: "rifast-app-database-user"
    EMAIL_FROM: "rifast-email-from"
    EMAIL_PASSWORD: "rifast-email-password"
    EMAIL_USER: "rifast-email-user"
    AWS_S3_ACCESS_ID: "rifast-aws-s3-access-id"
    AWS_S3_ACCESS_KEY: "rifast-aws-s3-access-key"
    AZURE_CLIENT_SECRET: "rifast-azure-client-secret"
    CLIENT_SECRET: "rifast-client-secret"
