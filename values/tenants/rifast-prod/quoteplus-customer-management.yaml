env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-rifast/quoteplus-customer-management-service-rifast
  tag: "1.0.0-28"   # CI-owned - real Jenkins build, repository corrected from the
  # -dev placeholder to match what the Jenkinsfile actually pushes (-rifast).

ingress:
  host: "rifast-quoteplus.customer.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below. See quoteplus-framework.yaml
# for the full reasoning on this pattern and CLAUDE.md.
configApp: {}

envFrom:
  configMaps: []

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # Two distinct AWS credential pairs exist here (AWS_S3_ACCESS_ID/KEY vs
  # AWS_ACCESS_KEY_ID/SECRET) and two distinct client-secret pairs
  # (AZURE_CLIENT_SECRET vs CLIENT_SECRET) - genuinely different keys, not
  # duplicates, kept as separate Key Vault secret names same as stage.
  # REPLACE_WITH_REAL_VALUE items still need real business data in Key
  # Vault; structural ones get populated with their already-known values.
  data:
    DATABASE_HOST: "rifast-database-host"
    DATABASE_PORT: "rifast-database-port"
    DB_SCHEMA: "rifast-db-schema"
    SUP_MDM_URL: "rifast-customer-sup-mdm-url"
    LANGUAGE_SERVICE_URL: "rifast-customer-language-service-url"
    QUOTE_URL: "rifast-customer-quote-url"
    EMAIL_HOST: "rifast-email-host"
    EMAIL_PORT: "rifast-email-port"
    EMAIL_SECURE: "rifast-email-secure"
    SHAREPOINT_ROOT_FOLDER: "rifast-sharepoint-root-folder"
    SITE_URL: "rifast-customer-site-url"
    AZURE_TENANT_ID: "rifast-azure-tenant-id"
    AZURE_CLIENT_ID: "rifast-azure-client-id"
    AZURE_SHAREPOINT_SITE_ID: "rifast-sharepoint-site-id"
    AZURE_SHAREPOINT_DRIVE_ID: "rifast-sharepoint-drive-id"
    APP_CLOUD_STORAGE: "rifast-customer-app-cloud-storage"
    AWS_S3_REGION: "rifast-aws-region"
    AWS_S3_BUCKET_NAME: "rifast-customer-aws-s3-bucket-name"
    CLIENT_ID: "rifast-azure-client-id"
    SITE_ID: "rifast-sharepoint-site-id"
    DRIVE_ID: "rifast-sharepoint-drive-id"
    TENANT_ID: "rifast-azure-tenant-id"
    FILE_PATH: "rifast-customer-file-path"
    MICROSOFT_OAUTH_TOKEN_URL: "rifast-microsoft-oauth-token-url"
    KEYCLOAK_SERVER_URL: "rifast-keycloak-server-url"
    KEYCLOAK_REALM: "rifast-keycloak-realm"
    # Global Data sync - confirmed 2026-10-28: not in customerdemo's current
    # real deployment manifest (doesn't exist there today), but needed for
    # RIFAST going forward per explicit instruction ("will need it in
    # future") - kept wired rather than removed. GLOBAL_DATA_SP_DRIVE_ID
    # reuses the same shared SharePoint drive as everything else.
    GLOBAL_DATA_SP_FOLDER_PATH: "rifast-customer-global-data-sp-folder-path"
    GLOBAL_DATA_SP_FILE_PATTERN: "rifast-customer-global-data-sp-file-pattern"
    GLOBAL_DATA_SYNC_TAB_NAME: "rifast-customer-global-data-sync-tab-name"
    GLOBAL_DATA_SP_DRIVE_ID: "rifast-customer-global-data-sp-drive-id"
    GLOBAL_DATA_SYNC_CRON: "rifast-customer-global-data-sync-cron"
    GLOBAL_DATA_SYNC_TIMEZONE: "rifast-customer-global-data-sync-timezone"
    GLOBAL_DATA_SYNC_NOTIFY: "rifast-customer-global-data-sync-notify"
    DATA_ADMIN_ROLE: "rifast-customer-data-admin-role"
    AWS_ACCESS_KEY_ID: "rifast-aws-access-key-id"
    AWS_SECRET_ACCESS_KEY: "rifast-aws-secret-access-key"
    DATABASE_NAME: "rifast-app-database-name"
    DATABASE_PASSWORD: "rifast-app-database-password"
    DATABASE_USER_NAME: "rifast-app-database-user"
    EMAIL_FROM: "rifast-email-from"
    EMAIL_PASSWORD: "rifast-email-password"
    EMAIL_USER: "rifast-email-user"
    AWS_S3_ACCESS_ID: "rifast-aws-s3-access-id"
    AWS_S3_ACCESS_KEY: "rifast-aws-s3-access-key"
    AZURE_CLIENT_SECRET: "rifast-azure-client-secret"
    CLIENT_SECRET: "rifast-client-secret"
