env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-rifast/quoteplus-user-management-service-dev
  tag: "1.0.0-28"   # PLACEHOLDER - no RIFAST-specific Jenkins stage yet, no real image
  # published. Non-empty on purpose so the chart's `required` guard passes and
  # the Deployment actually renders - expected to ImagePullBackOff until
  # Jenkins publishes a real tag here. Confirmed acceptable by the user.

ingress:
  host: "rifast-quoteplus.user.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below. See quoteplus-framework.yaml
# for the full reasoning on this pattern and CLAUDE.md.
configApp: {}

envFrom:
  configMaps: []

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # Keycloak realm QuotePlus-Rifast created 2026-10-28 on
  # https://keycloak.mindcaninc.com, cloned from QuotePlus-Customerdemo -
  # rifast-keycloak-server-url/-realm/-client-id/-client-secret/-client-uuid/
  # -web-client-id are all populated in Key Vault now.
  # QP_KEYCLOAK_CLIENT_UUID is set to "unused" - stage's own real deployment
  # has this field empty too (confirmed in gitops-quote-mrea), the app code
  # doesn't actually read it. REDIS_PASSWORD is a no-op either way (chart's
  # Redis has no AUTH configured, confirmed for stage - same chart used
  # here) but kept for parity/forward-compatibility.
  data:
    QP_KEYCLOAK_SERVER_URL: "rifast-keycloak-server-url"
    QP_KEYCLOAK_REALM: "rifast-keycloak-realm"
    QP_KEYCLOAK_CLIENT_ID: "rifast-keycloak-client-id"
    QP_KEYCLOAK_CLIENT_UUID: "rifast-keycloak-client-uuid"
    QP_KEYCLOAK_WEB_CLIENT_ID: "rifast-keycloak-web-client-id"
    VALID_APPLICATIONIDS: "rifast-user-management-valid-applicationids"
    QP_APP_REDIRECT_URL: "rifast-application-url"
    MAGIC_LINK_EXPIRE_TIME: "rifast-user-management-magic-link-expire-time"
    REDIS_HOST: "rifast-redis-host"
    REDIS_PORT: "rifast-redis-port"
    QP_KEYCLOAK_CLIENT_SECRET: "rifast-keycloak-client-secret"
    REDIS_PASSWORD: "rifast-redis-password-noop"
    # Found missing entirely during a cross-check against
    # MNC_QUOTE_REPO@customerdemo's real deployment manifest - this whole
    # Metabase BI-embedding block and USERS_API_URL were never added during
    # the original configApp->Key Vault conversion. METABASE_SITE_URL points
    # at a single shared MindCan-hosted Metabase instance (not customer-
    # specific); METABASE_COLLECTION_ID is the one piece that's genuinely
    # per-customer (which Metabase collection holds RIFAST's own reports) -
    # confirm with the dev team whether RIFAST has a dedicated collection
    # before populating it with a real value.
    USERS_API_URL: "rifast-user-management-users-api-url"
    METABASE_USERNAME: "rifast-metabase-username"
    METABASE_PASSWORD: "rifast-metabase-password"
    METABASE_SITE_URL: "rifast-metabase-site-url"
    METABASE_JWT_SHARED_SECRET: "rifast-metabase-jwt-shared-secret"
    METABASE_COLLECTION_ID: "rifast-user-management-metabase-collection-id"
