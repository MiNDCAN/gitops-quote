env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-rifast/quoteplus-user-management-service-dev
  tag: ""   # REPLACE_WITH_REAL_VALUE - no RIFAST-specific Jenkins stage yet

ingress:
  host: "rifast-quoteplus.user.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below. See quoteplus-framework.yaml
# for the full reasoning on this pattern and CLAUDE.md.
configApp: {}

envFrom:
  configMaps: []

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE - Keycloak values depend on RIFAST's production
  # realm, not yet shared. REDIS_PASSWORD is a no-op either way (chart's
  # Redis has no AUTH configured, confirmed for stage - same chart used
  # here) but kept for parity/forward-compatibility.
  data:
    QP_KEYCLOAK_SERVER_URL: "rifast-keycloak-server-url"
    QP_KEYCLOAK_REALM: "rifast-keycloak-realm"
    QP_KEYCLOAK_CLIENT_ID: "rifast-keycloak-client-id"
    QP_KEYCLOAK_CLIENT_UUID: "rifast-keycloak-client-uuid"
    QP_KEYCLOAK_WEB_CLIENT_ID: "rifast-keycloak-web-client-id"
    VALID_APPLICATIONIDS: "rifast-user-management-valid-applicationids"
    QP_APP_REDIRECT_URL: "rifast-application-url"
    MAGIC_LINK_EXPIRE_TIME: "rifast-user-management-magic-link-expire-time"
    REDIS_HOST: "rifast-redis-host"
    REDIS_PORT: "rifast-redis-port"
    QP_KEYCLOAK_CLIENT_SECRET: "rifast-keycloak-client-secret"
    REDIS_PASSWORD: "rifast-redis-password-noop"
