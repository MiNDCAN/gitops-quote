env: rifast-prod

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-rifast/quoteplus-supplier-service-rifast
  tag: "1.0.0-28"   # CI-owned - real Jenkins build, repository corrected from the
  # -dev placeholder to match what the Jenkinsfile actually pushes (-rifast).

ingress:
  host: "rifast-quoteplus.supplier.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below. See quoteplus-framework.yaml
# for the full reasoning on this pattern and CLAUDE.md.
configApp: {}

envFrom:
  configMaps: []

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # DNB_URL/OSM_URL are public third-party APIs, same regardless of customer,
  # but still routed through Key Vault per the "nothing committed" policy.
  # REPLACE_WITH_REAL_VALUE items still need real business data (mostly
  # RIFAST's own Azure/SharePoint tenant details, not mindcaninc's).
  data:
    DATABASE_HOST: "rifast-database-host"
    DATABASE_PORT: "rifast-database-port"
    DB_SCHEMA: "rifast-db-schema"
    DNB_URL: "rifast-supplier-dnb-url"
    OSM_URL: "rifast-supplier-osm-url"
    USERS_API_URL: "rifast-supplier-users-api-url"
    SUP_MDM_URL: "rifast-supplier-sup-mdm-url"
    QUOTE_URL: "rifast-supplier-quote-url"
    LANGUAGE_SERVICE_URL: "rifast-supplier-language-service-url"
    EMAIL_HOST: "rifast-email-host"
    EMAIL_PORT: "rifast-email-port"
    EMAIL_SECURE: "rifast-email-secure"
    SHAREPOINT_ROOT_FOLDER: "rifast-sharepoint-root-folder"
    SITE_URL: "rifast-supplier-site-url"
    AZURE_TENANT_ID: "rifast-azure-tenant-id"
    AZURE_CLIENT_ID: "rifast-azure-client-id"
    AZURE_SHAREPOINT_SITE_ID: "rifast-sharepoint-site-id"
    AZURE_SHAREPOINT_DRIVE_ID: "rifast-sharepoint-drive-id"
    APP_CLOUD_STORAGE: "rifast-supplier-app-cloud-storage"
    AWS_S3_REGION: "rifast-aws-region"
    AWS_S3_BUCKET_NAME: "rifast-supplier-aws-s3-bucket-name"
    CLIENT_ID: "rifast-azure-client-id"
    SITE_ID: "rifast-sharepoint-site-id"
    DRIVE_ID: "rifast-sharepoint-drive-id"
    TENANT_ID: "rifast-azure-tenant-id"
    FILE_PATH: "rifast-supplier-file-path"
    MICROSOFT_OAUTH_TOKEN_URL: "rifast-microsoft-oauth-token-url"
    CRITICALITITY_ID: "rifast-supplier-criticaltity-id-or-confirm-not-applicable"
    KEYCLOAK_SERVER_URL: "rifast-keycloak-server-url"
    KEYCLOAK_REALM: "rifast-keycloak-realm"
    MODEL_TYPE: "rifast-supplier-model-type"
    DATABASE_NAME: "rifast-app-database-name"
    DATABASE_PASSWORD: "rifast-app-database-password"
    DATABASE_USERNAME: "rifast-app-database-user"
    AWS_ACCESS_KEY_ID: "rifast-aws-access-key-id"
    AWS_SECRET_ACCESS_KEY: "rifast-aws-secret-access-key"
    EMAIL_USER: "rifast-email-user"
    EMAIL_PASSWORD: "rifast-email-password"
    EMAIL_FROM: "rifast-email-from"
    AWS_S3_ACCESS_ID: "rifast-aws-s3-access-id"
    AWS_S3_ACCESS_KEY: "rifast-aws-s3-access-key"
    AZURE_CLIENT_SECRET: "rifast-azure-client-secret"
    CLIENT_SECRET: "rifast-client-secret"
    DNB_KEY: "rifast-dnb-key"
    DNB_SECRET: "rifast-dnb-secret"
