# Dev overrides for quoteplus-temporal. Base chart's web.ingress.hosts/tls
# and web.additionalEnv hardcode stage's host/Keycloak realm - both fully
# overridden here since Helm replaces (not merges) list-type values.
#
# ingress host/annotations/TLS secret name are Helm chart wiring, not
# application config - left as plain values here, consistent with how
# every other tenant file in this repo treats ingress.host.
#
# Every additionalEnv entry below (even non-secret ones like
# TEMPORAL_AUTH_SCOPES) is sourced via secretKeyRef, not value: - the
# upstream Temporal chart has no configApp/ConfigMap mechanism of its own,
# so secretKeyRef is the only way to keep these out of the repo. See
# quoteplus-framework.yaml for the repo-wide "nothing committed" policy.
#
# TEMPORAL_DB_PASSWORD must match POSTGRES_PASSWORD in
# quoteplus-temporal-postgres.yaml - keep both Key Vault secrets in sync.
# TEMPORAL_AUTH_PROVIDER_URL/CALLBACK_URL and the Keycloak client
# ID/secret below all depend on a Keycloak realm for dev, which doesn't
# exist yet - REPLACE_WITH_REAL_VALUE throughout.
temporal:
  web:
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: quoteplus-letsencrypt-prod
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
        nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      hosts:
        - "dev-quoteplus.temporal.mindcaninc.com/"
      tls:
        - hosts:
            - dev-quoteplus.temporal.mindcaninc.com
          secretName: quoteplus-temporal-ui-tls
    additionalEnv:
      - name: TEMPORAL_AUTH_ENABLED
        valueFrom:
          secretKeyRef:
            name: quoteplus-temporal-secrets
            key: TEMPORAL_AUTH_ENABLED
      - name: TEMPORAL_AUTH_PROVIDER_URL
        valueFrom:
          secretKeyRef:
            name: quoteplus-temporal-secrets
            key: TEMPORAL_AUTH_PROVIDER_URL
      - name: TEMPORAL_AUTH_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: quoteplus-temporal-secrets
            key: TEMPORAL_AUTH_CLIENT_ID
      - name: TEMPORAL_AUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: quoteplus-temporal-secrets
            key: TEMPORAL_AUTH_CLIENT_SECRET
      - name: TEMPORAL_AUTH_CALLBACK_URL
        valueFrom:
          secretKeyRef:
            name: quoteplus-temporal-secrets
            key: TEMPORAL_AUTH_CALLBACK_URL
      - name: TEMPORAL_AUTH_SCOPES
        valueFrom:
          secretKeyRef:
            name: quoteplus-temporal-secrets
            key: TEMPORAL_AUTH_SCOPES

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE - not yet populated in kv-quoteplus-dev.
  # TEMPORAL_AUTH_CLIENT_ID/SECRET depend on a Keycloak client that doesn't
  # exist yet.
  data:
    TEMPORAL_DB_PASSWORD: "dev-temporal-postgres-password"
    TEMPORAL_AUTH_ENABLED: "dev-temporal-auth-enabled"
    TEMPORAL_AUTH_PROVIDER_URL: "dev-temporal-auth-provider-url"
    TEMPORAL_AUTH_CLIENT_ID: "dev-temporal-auth-client-id"
    TEMPORAL_AUTH_CLIENT_SECRET: "dev-temporal-auth-client-secret"
    TEMPORAL_AUTH_CALLBACK_URL: "dev-temporal-auth-callback-url"
    TEMPORAL_AUTH_SCOPES: "dev-temporal-auth-scopes"
