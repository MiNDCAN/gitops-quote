env: dev

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-dev/quoteplus-distribution-list-service-dev
  tag: "latest"   # PLACEHOLDER - no dev-specific Jenkins stage yet, no real image
  # published. Non-empty on purpose so the chart's `required` guard passes and
  # the Deployment actually renders - expected to ImagePullBackOff until
  # Jenkins publishes a real tag here (same accepted approach used for
  # rifast-prod's equivalent file).

ingress:
  host: "dev-quoteplus.distribution-list.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below. See quoteplus-framework.yaml
# for the full reasoning on this pattern and CLAUDE.md.
configApp: {}

envFrom:
  configMaps: []
  # Chart default hardcodes "quoteplus-distribution-list-secrets" (pre-dates
  # the -dev releaseName suffix) - override to match the Secret name
  # templates/externalsecret.yaml actually creates ({{ .Release.Name }}-secrets).
  secrets:
    - quoteplus-distribution-list-dev-secrets

secrets: {}

workloadIdentity:
  enabled: true

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE throughout - no Keycloak realm exists for dev
  # yet (out of scope for this buildout, don't assume or reuse
  # rifast-prod's realm). QP_KEYCLOAK_CLIENT_SECRET and
  # KEYCLOAK_CLIENT_SECRET are meant to be the SAME Keycloak client
  # (qtplus_admin) once one exists - same Key Vault secret name, not two
  # different values (matches stage's own resolved convention).
  data:
    QP_KEYCLOAK_SERVER_URL: "dev-keycloak-server-url"
    QP_KEYCLOAK_REALM: "dev-keycloak-realm"
    QP_KEYCLOAK_CLIENT_ID: "dev-keycloak-client-id"
    QP_KEYCLOAK_CLIENT_UUID: "dev-keycloak-client-uuid"
    QP_KEYCLOAK_WEB_CLIENT_ID: "dev-keycloak-web-client-id"
    VALID_APPLICATIONIDS: "dev-distribution-list-valid-applicationids"
    QP_APP_REDIRECT_URL: "dev-application-url"
    MAGIC_LINK_EXPIRE_TIME: "dev-distribution-list-magic-link-expire-time"
    USERS_API_URL: "dev-distribution-list-users-api-url"
    USER_DETAILS_URL: "dev-distribution-list-user-details-url"
    KEYCLOAK_SERVER_URL: "dev-keycloak-server-url"
    KEYCLOAK_REALM: "dev-keycloak-realm"
    KEYCLOAK_CLIENT_ID: "dev-keycloak-client-id"
    MDM_URL: "dev-distribution-list-mdm-url"
    REDIS_HOST: "dev-redis-host"
    REDIS_PORT: "dev-redis-port"
    DATABASE_HOST: "dev-database-host"
    DATABASE_PORT: "dev-database-port"
    DB_SCHEMA: "dev-db-schema"
    EMAIL_HOST: "dev-email-host"
    EMAIL_PORT: "dev-email-port"
    QP_KEYCLOAK_CLIENT_SECRET: "dev-keycloak-client-secret"
    KEYCLOAK_CLIENT_SECRET: "dev-keycloak-client-secret"
    REDIS_PASSWORD: "dev-redis-password-noop"
    DATABASE_NAME: "dev-app-database-name"
    DATABASE_USER_NAME: "dev-app-database-user"
    DATABASE_PASSWORD: "dev-app-database-password"
    EMAIL_USER: "dev-email-user"
    EMAIL_PASSWORD: "dev-email-password"
    EMAIL_FROM: "dev-email-from"
