# Dev overrides for quoteplus-temporal-worker. image.tag must stay an
# active/uncommented key - Jenkins's tag-writer does blind text
# substitution, not real YAML editing (see gitops-quote-mrea/CLAUDE.md).
# No dev-specific Jenkins stage exists yet.
image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-dev/quoteplus-temporal-worker-dev
  tag: "latest"   # PLACEHOLDER - CI-owned, no Jenkins stage yet, no real image
  # published. Non-empty on purpose so the chart's `required` guard passes and
  # the Deployment actually renders - expected to ImagePullBackOff until
  # Jenkins publishes a real tag here (same accepted approach used for
  # rifast-prod's equivalent file).

api:
  ingress:
    host: "dev-quoteplus.workflow-api.mindcaninc.com"

# Nothing committed here - every value (even non-secret config) is sourced
# from Key Vault via externalSecret.data below. See quoteplus-framework.yaml
# for the full reasoning on this pattern and CLAUDE.md.
#
# IMPORTANT: this chart's own values.yaml (charts/quoteplus-temporal-worker,
# copied as a QTP-867 scaffold with stage's real defaults baked in) bakes a
# non-empty configApp/secrets map as the CHART DEFAULT, not just stage's
# tenant override. Helm deep-merges maps, so setting configApp: {} /
# secrets: {} here does NOT clear those inherited keys - confirmed via
# `helm template`, which still rendered a ConfigMap/Secret with stage's
# baked-in values. Every key below is explicitly nulled (Helm's documented
# way to delete an inherited map key) to actually produce an empty map and
# stop the ConfigMap/Secret from rendering at all. Every other service
# chart in this repo defaults configApp/secrets to {} at the chart level,
# so this null-list is unique to this one chart - don't copy this pattern
# elsewhere without first checking the base chart's own values.yaml.
configApp:
  TEMPORAL_ADDRESS: null
  TEMPORAL_NAMESPACE: null
  TEMPORAL_TASK_QUEUE: null
  TEMPORAL_SEARCH_ATTRIBUTES: null
  DATABASE_HOST: null
  DATABASE_PORT: null
  DB_SCHEMA: null
  DB_SCHEMA_ENGINE: null
  DB_LOGGING: null
  USER_DETAILS_URL: null
  USER_SERVICE_APPLICATION_ID: null
  HEALTH_PORT: null
  HEALTH_CHECK_TIMEOUT_MS: null
  ALLOW_STUB_ACTIVITIES: null
  PORT: null
  METRICS_PORT: null
  CLIENT_CODE: null
  BUSINESS_TIMEZONE: null
  KEYCLOAK_URL: null
  KEYCLOAK_REALM: null
  KEYCLOAK_CLIENT_ID: null
  DIRECTORY_CACHE_TTL_MS: null
  WORK_QUEUE_STATUS_LOOKUP_TYPE: null
  WORK_QUEUE_PRIORITY_LOOKUP_TYPE: null
  NOTIFY_CHANNELS: null
  NOTIFY_POLL_MS: null
  NOTIFY_BATCH_SIZE: null
  NOTIFY_MAX_ATTEMPTS: null
  QUOTE_SERVICE_GRAPHQL_URL: null
  NOTIFICATION_API_URL: null

envFrom:
  configMaps: []
  # Chart default hardcodes "quoteplus-temporal-worker-secrets" (pre-dates
  # the -dev releaseName suffix) - override to match the Secret name
  # templates/externalsecret.yaml actually creates ({{ .Release.Name }}-secrets).
  secrets:
    - quoteplus-temporal-worker-dev-secrets

workloadIdentity:
  enabled: true

secrets:
  DATABASE_NAME: null
  DATABASE_USER_NAME: null
  DATABASE_PASSWORD: null
  SERVICE_TOKEN: null

externalSecret:
  enabled: true
  # REPLACE_WITH_REAL_VALUE - not yet populated in kv-quoteplus-dev.
  # DATABASE_* reuses the app DB credentials (same pattern as stage, per
  # the dev team's ops runbook) - same Key Vault secret as
  # quoteplus-management-service.yaml's DATABASE_PASSWORD etc. below.
  # KEYCLOAK_CLIENT_SECRET is the same qtplus_admin-equivalent client used
  # by every service here, once a Keycloak realm for dev exists.
  # SERVICE_TOKEN stays a placeholder - quote-management-service has no
  # bearer/token validation (confirmed for stage's code; re-confirm for
  # whatever build this points at), so a real value is currently a no-op.
  data:
    # These were previously relying on silent inheritance from this
    # chart's own stage-flavored defaults (TEMPORAL_ADDRESS pointed at
    # quote-temporal's own in-cluster Service, KEYCLOAK_URL/REALM were
    # literally stage's nonprod Keycloak) - now nulled above, so every one
    # of them must be supplied here or the worker silently loses required
    # config, not just secrets.
    TEMPORAL_ADDRESS: "dev-temporal-worker-temporal-address"
    TEMPORAL_NAMESPACE: "dev-temporal-worker-temporal-namespace"
    TEMPORAL_TASK_QUEUE: "dev-temporal-worker-task-queue"
    TEMPORAL_SEARCH_ATTRIBUTES: "dev-temporal-worker-search-attributes"
    DATABASE_HOST: "dev-database-host"
    DATABASE_PORT: "dev-database-port"
    DB_SCHEMA: "dev-db-schema"
    DB_SCHEMA_ENGINE: "dev-temporal-worker-db-schema-engine"
    DB_LOGGING: "dev-temporal-worker-db-logging"
    USER_DETAILS_URL: "dev-temporal-worker-user-details-url"
    USER_SERVICE_APPLICATION_ID: "dev-temporal-worker-user-service-application-id"
    HEALTH_PORT: "dev-temporal-worker-health-port"
    HEALTH_CHECK_TIMEOUT_MS: "dev-temporal-worker-health-check-timeout-ms"
    ALLOW_STUB_ACTIVITIES: "dev-temporal-worker-allow-stub-activities"
    PORT: "dev-temporal-worker-port"
    METRICS_PORT: "dev-temporal-worker-metrics-port"
    CLIENT_CODE: "dev-temporal-worker-client-code"
    BUSINESS_TIMEZONE: "dev-temporal-worker-business-timezone"
    KEYCLOAK_URL: "dev-keycloak-server-url"
    KEYCLOAK_REALM: "dev-keycloak-realm"
    KEYCLOAK_CLIENT_ID: "dev-keycloak-client-id"
    DIRECTORY_CACHE_TTL_MS: "dev-temporal-worker-directory-cache-ttl-ms"
    WORK_QUEUE_STATUS_LOOKUP_TYPE: "dev-temporal-worker-work-queue-status-lookup-type"
    WORK_QUEUE_PRIORITY_LOOKUP_TYPE: "dev-temporal-worker-work-queue-priority-lookup-type"
    NOTIFY_CHANNELS: "dev-temporal-worker-notify-channels"
    NOTIFY_POLL_MS: "dev-temporal-worker-notify-poll-ms"
    NOTIFY_BATCH_SIZE: "dev-temporal-worker-notify-batch-size"
    NOTIFY_MAX_ATTEMPTS: "dev-temporal-worker-notify-max-attempts"
    QUOTE_SERVICE_GRAPHQL_URL: "dev-temporal-worker-quote-service-graphql-url"
    NOTIFICATION_API_URL: "dev-temporal-worker-notification-api-url"
    DATABASE_NAME: "dev-app-database-name"
    DATABASE_USER_NAME: "dev-app-database-user"
    DATABASE_PASSWORD: "dev-app-database-password"
    SERVICE_TOKEN: "dev-service-token-placeholder"
    KEYCLOAK_CLIENT_SECRET: "dev-keycloak-client-secret"
    INTERNAL_API_KEY: "dev-internal-api-key"
