apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: quoteplus-dev-platform
  namespace: argocd
  labels:
    team: quoteplus
    solution: quoteplus
    customer: internal
    type: application-set
    layer: platform
  annotations:
    argocd.argoproj.io/description: "Cluster platform for aks-quoteplus-dev: ingress-nginx, cert-manager, ClusterIssuer, promtail, namespaces, External Secrets Operator (Key Vault, not a committed Nexus credential - see charts/quoteplus-external-secrets)."
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          # Negative waves: all of this must exist before any workload.
          - service: quoteplus-ingress-nginx
            namespace: ingress-nginx
            wave: "-20"
          - service: quoteplus-cert-manager
            namespace: cert-manager
            wave: "-20"
          # Creates the namespaces ahead of External Secrets Operator, which
          # needs them to exist to fan its per-namespace ServiceAccount/
          # SecretStore pair out to. The app charts' own CreateNamespace
          # can't be relied on here since manifest generation fails before
          # that fires until a real image.tag exists (by design).
          - service: quoteplus-namespaces
            namespace: quoteplus-system
            wave: "-15"
          # ESO + per-namespace workload identity + Key Vault-sourced Nexus
          # pull secret - replaces gitops-quote-mrea's
          # quoteplus-nexus-pull-secret (a plaintext dockerconfigjson, a
          # stage-only shortcut not used in this repo).
          - service: quoteplus-external-secrets
            namespace: quote-external-secrets
            wave: "-10"
          # Cluster-scoped issuer; needs cert-manager's CRDs to exist first.
          - service: quoteplus-cluster-issuer
            namespace: cert-manager
            wave: "-5"
          - service: quoteplus-promtail
            namespace: promtail
            wave: "-5"
  template:
    metadata:
      name: 'quoteplus-dev-platform-{{.service}}'
      namespace: argocd
      labels:
        team: quoteplus
        solution: quoteplus
        customer: internal
        type: application
        layer: platform
        service: '{{.service}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: quoteplus-dev
      destination:
        name: aks-quoteplus-dev
        namespace: '{{.namespace}}'
      source:
        repoURL: https://github.com/MiNDCAN/gitops-quote.git
        # Deliberately main, not production - see quoteplus-dev-apps.yaml's
        # comment for the full reasoning.
        targetRevision: main
        path: 'charts/{{.service}}'
        helm:
          # -dev suffix so resource/pod names are distinguishable at a
          # glance (e.g. quoteplus-cert-manager-dev) - explicit instruction.
          releaseName: '{{.service}}-dev'
          ignoreMissingValueFiles: true
          valueFiles:
            - '../../values/tenants/dev/{{.service}}.yaml'
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - '.webhooks[]?.namespaceSelector.matchExpressions'
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - '.webhooks[]?.namespaceSelector.matchExpressions'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
