{{- if .Values.secrets }}
{{- /*
  Plain Secret, values committed directly in this repo - not Key Vault
  backed. Deliberate for now, not an oversight; see CLAUDE.md. Guarded on
  .Values.secrets so an empty map (RIFAST, which uses externalSecret
  instead) doesn't render an empty Secret fighting the ExternalSecret for
  the same object name - see quoteplus-pgadmin's own fix for this exact
  bug earlier in this repo's history.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/part-of: quoteplus
    app.kubernetes.io/managed-by: argocd
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
