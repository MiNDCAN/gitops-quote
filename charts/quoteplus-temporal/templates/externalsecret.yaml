{{- /*
  Sources this chart's own Secret (same name/shape templates/secret.yaml
  would otherwise create: {{ .Release.Name }}-secrets) from Key Vault via
  the per-namespace SecretStore charts/quoteplus-external-secrets sets up,
  instead of a plaintext .Values.secrets map. secret.yaml already renders
  nothing when .Values.secrets is empty, so leaving that map empty in a
  tenant's values file and enabling this instead is the whole switch - no
  other template changes needed.

  IMPORTANT for this chart specifically: the plaintext secret.yaml it
  replaces was a pre-install,pre-upgrade hook at weight "-1", added
  specifically to apply before the upstream temporal subchart's schema Job
  (also a pre-install hook, weight "0") - without that ordering the Job's
  init container failed with `secret "quoteplus-temporal-secrets" not
  found`. An ExternalSecret does not give the same guarantee even if
  annotated as a hook: Helm hook ordering only controls when the
  ExternalSecret object itself gets applied, not when ESO's controller
  finishes reconciling it into an actual Secret (that happens async, on
  ESO's own schedule). On a brand-new namespace, make sure this
  ExternalSecret has synced at least once (check `kubectl get secret
  quoteplus-temporal-secrets -n quote-temporal` exists) before the first
  sync of this Temporal release, rather than assuming hook ordering alone
  covers it this time.
*/}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/part-of: quoteplus
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: SecretStore
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $k, $remote := .Values.externalSecret.data }}
    - secretKey: {{ $k | quote }}
      remoteRef:
        key: {{ $remote | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
