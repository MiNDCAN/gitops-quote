{{- /*
  Plain Secret, values committed directly in this repo - not Key Vault
  backed. Deliberate for now, not an oversight; see CLAUDE.md. Holds the
  temporal Postgres role's password and the Keycloak OIDC client secret for
  the Web UI - referenced by the temporal subchart via existingSecret:
  quoteplus-temporal-secrets (see values.yaml).

  Must exist before charts/temporal/templates/server-job.yaml (the schema
  Job) runs - that Job is itself a pre-install,pre-upgrade hook at weight
  "0", which on a fresh install runs BEFORE this repo's own non-hook
  templates would otherwise apply, so the schema Job's init container
  failed with `secret "quoteplus-temporal-secrets" not found` (confirmed
  live 2026-09-30). Hooking this Secret too, at a lower weight, fixes the
  ordering without a delete-policy - it stays a normal, persistent Secret
  after the hook phase, same as before.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/part-of: quoteplus
    app.kubernetes.io/managed-by: argocd
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
