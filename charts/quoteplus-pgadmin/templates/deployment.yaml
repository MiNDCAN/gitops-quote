apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/part-of: quoteplus
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- if .Values.workloadIdentity.enabled }}
      serviceAccountName: {{ .Values.workloadIdentity.serviceAccountName }}
      {{- end }}
      # pgadmin4's official image runs as uid/gid 5050 - the PVC (Azure
      # managed-csi) is otherwise mounted root-owned and pgAdmin can't
      # write its config DB to /var/lib/pgadmin.
      securityContext:
        fsGroup: 5050
      containers:
        - name: pgadmin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: PGADMIN_LISTEN_PORT
              value: "{{ .Values.service.targetPort }}"
            - name: PGADMIN_SERVER_JSON_FILE
              value: /pgadmin4/servers.json
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
            {{- if .Values.pgpassFile.enabled }}
            - name: pgpass
              mountPath: /pgadmin4/pgpass
              subPath: pgpass
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: servers
          configMap:
            name: {{ .Release.Name }}-servers
        {{- if .Values.pgpassFile.enabled }}
        - name: pgpass
          secret:
            secretName: {{ .Release.Name }}-secrets
            defaultMode: 0600
            items:
              - key: PGPASS_FILE
                path: pgpass
        {{- end }}
