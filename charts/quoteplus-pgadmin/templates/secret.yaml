{{- if .Values.secrets }}
{{- /*
  Plain Secret, values committed directly in this repo - not Key Vault
  backed. Deliberate for now, not an oversight; see CLAUDE.md. This is
  pgAdmin's OWN login, separate from the Postgres DB credentials in
  quoteplus-postgres-secrets. Guarded on .Values.secrets (added - every
  other chart in this repo already guards its secret.yaml this way) so a
  tenant that nulls every key here doesn't still render an empty Secret
  that fights the ExternalSecret-owned Secret of the same name.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/part-of: quoteplus
    app.kubernetes.io/managed-by: argocd
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
