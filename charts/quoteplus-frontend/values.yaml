# Defaults for quoteplus-frontend. Per-environment overrides live in
# values/tenants/<env>/quoteplus-frontend.yaml.

replicaCount: 1
env: ""

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus/quoteplus-frontend
  tag: ""                       # REQUIRED - the chart fails to render if unset
  pullPolicy: IfNotPresent
  pullSecrets: [quoteplus-nexus-secrets]

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 80                # matches the AWS container port (nginx serving the build)

ingress:
  enabled: true
  className: nginx
  path: /
  host: ""                      # set per environment
  annotations:
    cert-manager.io/cluster-issuer: quoteplus-letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  tls:
    enabled: true
    secretName: quoteplus-frontend-tls

# Workload identity was only ever needed for Key Vault access via ESO -
# disabled now that secrets are committed directly, see CLAUDE.md.
workloadIdentity:
  enabled: false
  serviceAccountName: quoteplus-workload-sa

# Sourced from Key Vault via the per-namespace SecretStore (see
# charts/quoteplus-external-secrets) instead of a plaintext secrets: map -
# see templates/externalsecret.yaml. data maps K8s secret key -> Key Vault
# secret name.
externalSecret:
  enabled: false
  storeName: quoteplus-azure-keyvault
  refreshInterval: 1h
  data: {}

envFrom:
  configMaps:
    - quoteplus-frontend-configmap
  secrets:
    - quoteplus-frontend-secrets

# Non-secret configuration only. Real REACT_APP_* keys confirmed against
# the actual dev environment (not just the AWS ConfigMap dump, which turned
# out to be missing several and had two that don't really exist) - fill
# real URLs per environment in values/tenants/<env>/quoteplus-frontend.yaml.
configApp: {}

# Real secret values committed directly per-environment in
# values/tenants/<env>/quoteplus-frontend.yaml - not Key Vault backed.
# LIMANS_API_KEY, LIMANS_SECRET_KEY, LIMANS_TOKEN live there.
secrets: {}

resources:
  requests: { cpu: "250m", memory: "256Mi" }
  limits:   { cpu: "500m", memory: "512Mi" }
