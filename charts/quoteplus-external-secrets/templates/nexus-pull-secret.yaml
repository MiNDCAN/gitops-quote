{{- /*
  Nexus image-pull credential, one per namespace that runs QuotePlus images -
  sourced from Key Vault rather than committed to this repo. Unlike
  gitops-quote-mrea's charts/quoteplus-nexus-pull-secret (a plain Secret
  from a committed dockerconfigjson, an explicit stage-only shortcut - see
  that repo's CLAUDE.md "Secrets" section), this repo holds a real paying
  customer's production infrastructure and is public, so no credential is
  committed here at all.

  The Key Vault secret must hold a complete .dockerconfigjson document:
    {"auths":{"nexus-registry.mindcaninc.com:8443":{"username":"...","password":"...","auth":"<base64 user:pass>"}}}
*/}}
{{- $g := .Values.workloadIdentity -}}
{{- $n := .Values.nexusPullSecret -}}
{{- if and $g.enabled $n.enabled }}
{{- range $ns := $g.namespaces }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $n.name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: quoteplus
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: {{ $n.refreshInterval }}
  secretStoreRef:
    name: {{ $g.storeName }}
    kind: SecretStore
  target:
    name: {{ $n.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ required "nexusPullSecret.keyVaultKey is required" $n.keyVaultKey | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
{{- end }}
