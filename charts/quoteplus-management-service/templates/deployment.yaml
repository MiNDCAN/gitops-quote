apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quoteplus.name" . }}
  labels:
    {{- include "quoteplus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "quoteplus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quoteplus.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        # Required for the Azure workload-identity webhook to inject the
        # projected token. Without it the pod falls back to no credential and
        # every Key Vault call fails at runtime, not at start.
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        checksum/config: {{ toYaml .Values.configApp | sha256sum }}
    spec:
      {{- if .Values.workloadIdentity.enabled }}
      serviceAccountName: {{ .Values.workloadIdentity.serviceAccountName }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "quoteplus.name" . }}
          image: {{ include "quoteplus.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            {{- range .Values.envFrom.configMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.envFrom.secrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
