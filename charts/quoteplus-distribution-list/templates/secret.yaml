{{- if .Values.secrets }}
{{- /*
  Plain Secret, values committed directly in this repo - not Key Vault
  backed. Deliberate for now, not an oversight; see CLAUDE.md.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quoteplus.name" . }}-secrets
  labels:
    {{- include "quoteplus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
