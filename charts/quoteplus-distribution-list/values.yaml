# Defaults for quoteplus-distribution-list. Per-environment overrides live in
# values/tenants/<env>/quoteplus-distribution-list.yaml. Scaffolded from
# charts/quoteplus-user-management's shape (closest existing service -
# QP_KEYCLOAK_*/REDIS_*/DATABASE_* env shape).

replicaCount: 1
env: ""

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus-dev/quoteplus-distribution-list-service-dev
  tag: ""                       # REQUIRED - CI-owned, written by Jenkins on first/every build
  pullPolicy: IfNotPresent
  pullSecrets: [quoteplus-nexus-secrets]

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3009              # confirmed with the dev team 2026-10-15

ingress:
  enabled: true
  className: nginx
  path: /
  host: ""                      # set per environment
  annotations:
    cert-manager.io/cluster-issuer: quoteplus-letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  tls:
    enabled: true
    secretName: quoteplus-distribution-list-tls

# Workload identity was only ever needed for Key Vault access via ESO -
# disabled now that secrets are committed directly, see CLAUDE.md.
workloadIdentity:
  enabled: false
  serviceAccountName: quoteplus-workload-sa

# Sourced from Key Vault via the per-namespace SecretStore (see
# charts/quoteplus-external-secrets) instead of a plaintext secrets: map -
# see templates/externalsecret.yaml. data maps K8s secret key -> Key Vault
# secret name.
externalSecret:
  enabled: false
  storeName: quoteplus-azure-keyvault
  refreshInterval: 1h
  data: {}

envFrom:
  configMaps:
    - quoteplus-distribution-list-configmap
  secrets:
    - quoteplus-distribution-list-secrets

configApp: {}

# Real secret values committed directly per-environment - not Key Vault
# backed, see CLAUDE.md.
secrets: {}

resources:
  requests: { cpu: "250m", memory: "512Mi" }
  limits:   { cpu: "500m", memory: "1Gi" }
