# Defaults for quoteplus-framework. Per-environment overrides live in
# values/tenants/<env>/quoteplus-framework.yaml.

replicaCount: 1
env: ""

image:
  repository: nexus-registry.mindcaninc.com:8443/quoteplus/quoteplus-framework
  tag: ""                       # REQUIRED - the chart fails to render if unset
  pullPolicy: IfNotPresent
  pullSecrets: [quoteplus-nexus-secrets]

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8000              # matches the AWS container port

ingress:
  enabled: true
  className: nginx
  path: /
  host: ""                      # set per environment
  annotations:
    cert-manager.io/cluster-issuer: quoteplus-letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  tls:
    enabled: true
    secretName: quoteplus-framework-tls

# Workload identity was only ever needed for Key Vault access via ESO -
# disabled now that secrets are committed directly, see CLAUDE.md.
workloadIdentity:
  enabled: false
  serviceAccountName: quoteplus-workload-sa

# Sourced from Key Vault via the per-namespace SecretStore (see
# charts/quoteplus-external-secrets) instead of a plaintext secrets: map -
# see templates/externalsecret.yaml. data maps K8s secret key -> Key Vault
# secret name.
externalSecret:
  enabled: false
  storeName: quoteplus-azure-keyvault
  refreshInterval: 1h
  data: {}

envFrom:
  configMaps:
    - quoteplus-framework-configmap
  secrets:
    - quoteplus-framework-secrets

# AWS cluster's framework-config ConfigMap has DATABASE_HOST, DATABASE_PORT,
# DB_SCHEMA - fill real values per environment.
configApp: {}

# Real secret values committed directly per-environment - not Key Vault
# backed. AWS cluster's framework-secret has (at least) DATABASE_NAME,
# DATABASE_USER_NAME, DATABASE_PASSWORD, SUPPORT_EMAIL, AZURE_CLIENT_ID and
# one more key not captured by the read-only scan - confirm the full key list
# before filling values/tenants/<env>/quoteplus-framework.yaml.
secrets: {}

# AWS cluster left this unset (no explicit requests/limits) - these are
# reasonable defaults matching this service's peers, not an observed value.
resources:
  requests: { cpu: "250m", memory: "512Mi" }
  limits:   { cpu: "500m", memory: "1Gi" }
