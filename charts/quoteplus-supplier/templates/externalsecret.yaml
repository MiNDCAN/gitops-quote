{{- /*
  Sources this chart's own Secret (same name/shape templates/secret.yaml
  would otherwise create: {{ .Release.Name }}-secrets) from Key Vault via
  the per-namespace SecretStore charts/quoteplus-external-secrets sets up,
  instead of a plaintext .Values.secrets map. secret.yaml already renders
  nothing when .Values.secrets is empty, so leaving that map empty in a
  tenant's values file and enabling this instead is the whole switch - no
  other template changes needed.
*/}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/part-of: quoteplus
    app.kubernetes.io/managed-by: argocd
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: SecretStore
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $k, $remote := .Values.externalSecret.data }}
    - secretKey: {{ $k | quote }}
      remoteRef:
        key: {{ $remote | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
